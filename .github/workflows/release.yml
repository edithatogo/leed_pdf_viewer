name: Release

on:
  # Automatic trigger: Push a tag like v2.5.0
  push:
    tags:
      - 'v*'
  
  # Manual trigger: Use "Run workflow" button in GitHub Actions UI
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v2.5.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    
    permissions:
      contents: write  # Required to create releases
    
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_APPWRITE_ENDPOINT: ${{ vars.PUBLIC_APPWRITE_ENDPOINT }}
          PUBLIC_APPWRITE_PROJECT_ID: ${{ vars.PUBLIC_APPWRITE_PROJECT_ID }}
          PUBLIC_APPWRITE_DATABASE_ID: ${{ vars.PUBLIC_APPWRITE_DATABASE_ID }}
          PUBLIC_APPWRITE_STORAGE_BUCKET_ID: ${{ vars.PUBLIC_APPWRITE_STORAGE_BUCKET_ID }}
          PUBLIC_APPWRITE_SHARED_PDFS_COLLECTION_ID: ${{ vars.PUBLIC_APPWRITE_SHARED_PDFS_COLLECTION_ID }}
          PUBLIC_APPWRITE_PDF_ANNOTATIONS_COLLECTION_ID: ${{ vars.PUBLIC_APPWRITE_PDF_ANNOTATIONS_COLLECTION_ID }}
        with:
          # Use tag name if triggered by tag push, otherwise use manual input
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'LeedPDF ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: ''
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          assetNamePattern: 'LeedPDF_Setup.[ext]'
          args: --target x86_64-pc-windows-msvc --bundles nsis
